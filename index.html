<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marlon Steiner — Dev Looking For Work</title>
  <meta name="description" content="Marlon Steiner — developer looking for work. A landing page that is also a playable snake game." />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Fluid type: scales with the viewport but never smaller/larger than the
       clamp bounds. This is what keeps the headline from overflowing on
       narrow windows without needing a single media query. */
    .headline-line { font-size: clamp(2.25rem, 11vw, 9rem); line-height: 0.9; }
    .footer-name   { font-size: clamp(0.75rem, 2vw, 1rem); }
  </style>
</head>

<!-- The whole page is plain HTML and works with JavaScript disabled.
     The game canvas will later be layered BEHIND this content at z-index 0. -->
<body class="min-h-screen bg-white text-black antialiased selection:bg-black selection:text-white">

  <!-- z-10 reserves the layer above the future canvas. -->
  <div class="relative z-10 min-h-screen flex flex-col">

    <!-- ── Top right: hamburger ─────────────────────────────────────────── -->
    <header class="flex justify-end p-5 sm:p-8">
      <button
        id="menu-button"
        type="button"
        aria-expanded="false"
        aria-label="Open CV"
        class="group flex h-10 w-10 flex-col items-center justify-center gap-[6px] rounded-sm
               focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4
               focus-visible:outline-black"
      >
        <span class="block h-[2px] w-7 bg-black transition-transform duration-200 group-hover:-translate-y-[1px]"></span>
        <span class="block h-[2px] w-7 bg-black"></span>
        <span class="block h-[2px] w-7 bg-black transition-transform duration-200 group-hover:translate-y-[1px]"></span>
      </button>
    </header>

    <!-- ── Center: headline + logo row ──────────────────────────────────── -->
    <!-- pointer-events-none on <main> lets clicks fall through to the canvas
         later, while the links below re-enable pointer events for themselves. -->
    <main class="flex flex-1 flex-col items-center justify-center px-4 pointer-events-none">

      <!-- #text-block and #logo-row are measured with getBoundingClientRect()
           in a later stage to turn them into blocked grid cells. -->
      <h1 id="text-block" class="text-center font-black uppercase tracking-tight">
        <span class="headline-line block">Dev Looking</span>
        <span class="headline-line block">For Work</span>
      </h1>

      <div id="logo-row" class="mt-8 flex items-center gap-5 sm:gap-7">
        <a
          href="https://www.linkedin.com/in/marlonsteiner/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn"
          class="pointer-events-auto transition-opacity hover:opacity-50
                 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4
                 focus-visible:outline-black"
        >
          <svg class="h-7 w-7 sm:h-8 sm:w-8" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/>
          </svg>
        </a>

        <span aria-hidden="true" class="text-2xl font-light sm:text-3xl">&amp;</span>

        <a
          href="https://github.com/MarlonSteiner"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub"
          class="pointer-events-auto transition-opacity hover:opacity-50
                 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4
                 focus-visible:outline-black"
        >
          <svg class="h-7 w-7 sm:h-8 sm:w-8" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .3a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.58v-2.23c-3.34.73-4.04-1.42-4.04-1.42-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.84 2.81 1.31 3.5 1 .1-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.11-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6.01 0c2.29-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .3z"/>
          </svg>
        </a>
      </div>
    </main>

    <!-- ── Bottom center: signature ─────────────────────────────────────── -->
    <footer class="flex justify-center p-5 sm:p-8">
      <p class="footer-name font-medium uppercase tracking-[0.2em]">
        Marlon Steiner<sup class="ml-[2px] text-[0.6em] align-super">&copy;</sup>
      </p>
    </footer>

  </div>
</body>
</html>
